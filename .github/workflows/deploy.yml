name: Mini Socialpay

on:
  push:
    branches: [ main ]
  workflow_dispatch: { }

env:
  REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}/mini-microservice

jobs:
  gradle-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ auth-service, user-service, payment-service, gateway-service ]
        java_version: [ "21" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java_version }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: microservice
        run: ./gradlew :${{ matrix.service }}:bootJar -x test --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: microservice/${{ matrix.service }}/build/libs/*.jar

  docker-build:
    needs: gradle-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ auth-service, user-service, payment-service, gateway-service ]
        java_version: [ "21" ]
        include:
          - context: microservice
            dockerfile: microservice/Dockerfile
          - service: admin-service
            java_version: "21"
            context: admin
            dockerfile: admin/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: matrix.context == 'microservice'
        with:
          name: ${{ matrix.service }}-jar
          path: microservice/${{ matrix.service }}/build/libs/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            JAVA_VERSION=${{ matrix.java_version }}
          tags: |
            ${{ env.REGISTRY }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "microservice/docker-compose.prod.yml,microservice/Caddyfile,microservice/alloy-config.alloy"
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 1
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f